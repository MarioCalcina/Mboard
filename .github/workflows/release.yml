name: Release APK
# Compila un APK de release firmado siempre con la misma clave, para poder actualizar
# sin desinstalar. Requiere los secrets descritos en el README (sección "Publicar una versión").

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret MBOARD_KEYSTORE_BASE64 (ver README, sección 'Publicar una versión')"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mboard.jks"

      - name: Build with Gradle
        env:
          MBOARD_KEYSTORE_FILE: ${{ runner.temp }}/mboard.jks
          MBOARD_KEYSTORE_PASSWORD: ${{ secrets.MBOARD_KEYSTORE_PASSWORD }}
          MBOARD_KEY_ALIAS: ${{ secrets.MBOARD_KEY_ALIAS }}
          MBOARD_KEY_PASSWORD: ${{ secrets.MBOARD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mboard-release
          path: app/build/outputs/apk/release/*-release*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*-release*.apk --title "Mboard $GITHUB_REF_NAME" --generate-notes

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
